name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - master
      - feat/prod
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Container to AWS Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag, and Push Image to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.lambda
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME || 'freakyfit-backend' }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME || 'freakyfit-backend' }}:latest

      - name: Update Worker Lambda Function
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME || 'freakyfit-backend' }}
          IMAGE_TAG: ${{ github.sha }}
          WORKER_LAMBDA_NAME: ${{ secrets.WORKER_LAMBDA_NAME || 'freakyfit-worker' }}
        run: |
          if aws lambda get-function --function-name "$WORKER_LAMBDA_NAME" > /dev/null 2>&1; then
            echo "Updating Lambda function: $WORKER_LAMBDA_NAME"
            aws lambda update-function-code \
              --function-name "$WORKER_LAMBDA_NAME" \
              --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              --publish
            aws lambda wait function-updated --function-name "$WORKER_LAMBDA_NAME"
            aws lambda update-function-configuration \
              --function-name "$WORKER_LAMBDA_NAME" \
              --timeout 300 \
              --memory-size 2048 > /dev/null 2>&1 || true
            echo "Lambda update successful!"
          else
            echo "Lambda function '$WORKER_LAMBDA_NAME' does not exist yet."
            echo "Image pushed successfully. You can now create the function in AWS Console."
          fi

      - name: Update API Lambda Function (Optional)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME || 'freakyfit-backend' }}
          IMAGE_TAG: ${{ github.sha }}
          API_LAMBDA_NAME: ${{ secrets.API_LAMBDA_NAME || 'freakyfit-api' }}
        run: |
          if aws lambda get-function --function-name "$API_LAMBDA_NAME" > /dev/null 2>&1; then
            echo "Updating API Lambda function: $API_LAMBDA_NAME"
            aws lambda update-function-code \
              --function-name "$API_LAMBDA_NAME" \
              --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              --publish
            aws lambda wait function-updated --function-name "$API_LAMBDA_NAME"
            aws lambda update-function-configuration \
              --function-name "$API_LAMBDA_NAME" \
              --timeout 30 \
              --memory-size 1024 > /dev/null 2>&1 || true
            echo "API Lambda update successful!"
          else
            echo "API Lambda '$API_LAMBDA_NAME' not found (optional). Skipping."
          fi
